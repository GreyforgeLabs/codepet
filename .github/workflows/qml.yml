name: QML offscreen contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qml:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      XDG_CACHE_HOME: /tmp/codepet-qt-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install offscreen Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      # PySide6 6.8.3 has no wheels for the runner's newer default Python: pin 3.12.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned test-only Qt and image runtime
        run: python3 -m pip install PySide6==6.8.3 Pillow==11.1.0
      # Every offscreen smoke in qml/tests (spec §17.1); a smoke exits non-zero on any FAIL.
      - name: QML smokes
        run: |
          set -e
          for smoke in qml/tests/*Smoke.qml; do
            echo "== $smoke"
            python3 qml/tests/run_qml.py "$smoke"
          done
      - name: Overlay host and bar plugin contracts
        run: |
          python3 qml/tests/test_overlay_windows.py
          python3 qml/tests/test_overlay_drag.py
          python3 qml/tests/test_overlay_host.py
          python3 qml/tests/test_work_host.py
          python3 qml/tests/test_update_host.py
          python3 qml/tests/test_pet_life_native.py --output "$RUNNER_TEMP/codepet-life-native"
          python3 qml/tests/test_work_card_native.py --output "$RUNNER_TEMP/codepet-work-card-native"
          python3 qml/tests/test_quickshell_host.py
          python3 qml/tests/test_bar_plugin.py
      - name: Pet assets (legacy sprites, v0.2 packs, invalid-pack fixtures, distinctness)
        run: |
          python3 qml/tests/test_sprite_assets.py
          python3 qml/tests/test_pet_assets.py
          python3 qml/tests/test_pet_assets_invalid.py
          python3 qml/tests/test_pet_distinctness.py
      # v0.3 icon set (SPEC-v0.3 §4): both install trees, sizes, alpha, key residue, provenance.
      # tools/petart/icons.py --check needs the source sheets (not in the repository).
      - name: Icon assets (v0.3 icon set, invalid-set fixtures)
        run: |
          python3 qml/tests/test_icon_assets.py
          python3 qml/tests/test_icon_assets_invalid.py
      # tools/petart/extract.py --check needs the GPT Image 2 source sheets, the v0.2.1
      # release asset codepet-art-sources-v0.2.tar (about 200 MB, not in the repository), so
      # it is not run in CI. The manifests' sha256 checks above cover the committed frames.
      # Source-art catalog (PR #7): stdlib-only checks that also fail under -O. Isolated
      # mode (-I) ignores user site-packages, so test_verify.py's optional Pillow --alpha
      # recheck skips when Pillow is installed only for the user.
      - name: Source-art library verifier and its regression test
        run: |
          python3 -I docs/art-library/verify.py
          python3 -I docs/art-library/test_verify.py
      - name: Install, uninstall and measurement tooling (temporary HOME, stub tools)
        run: |
          python3 qml/tests/test_install_scripts.py
          python3 qml/tests/test_update.py
          python3 qml/tests/test_runtime_regressions.py
      # Calm copy, and the v0.3 kid copy rules K1/K2/K8 over the plugin's strings, its
      # kid-facing QML and the species fields that reach the screen; the plugin's copy table
      # must be the contract plus the WP5 additions.
      - name: Copy rules
        run: |
          python3 qml/tests/copy_lint.py
          python3 tools/ui/gen_plugin_strings.py --check
      # v0.3 WP0 contracts: vectors replayed by a reference model, fixtures vs schema, v5 DDL,
      # K1/K2/K8 over strings.json (standard library only).
      - name: v0.3 contracts
        run: python3 docs/v0.3/contracts/check_contracts.py
      - name: Node model tests (bar model, presence model, state machine, life text)
        run: |
          node --version
          node --test qml/tests/*.mjs
      # v0.3 WP3: the OpenCode and Hermes plugins, offline (stand-in shim, no client runs).
      - name: Client integration plugins
        run: |
          node --test integrations/opencode/codepet.test.mjs
          python3 integrations/hermes/test_plugin.py
      - name: CI matrix covers every test; release docs present
        run: |
          python3 qml/tests/test_ci_matrix.py
          python3 qml/tests/test_release_docs.py
      # qml/tests/stubs stands in for the Omarchy shell's qs.Commons; the bar plugin's popup
      # files are linted too (the four Quickshell-only files need the shell and are covered by
      # test_bar_plugin.py's live load instead).
      - name: Portable QML lint
        run: |
          pyside6-qmllint -I qml -I qml/tests/stubs qml/shared/*.qml qml/standalone/*.qml qml/tests/*Smoke.qml \
            qml/omarchy/WorkPanel.qml \
            $(ls omarchy-plugin/*.qml | grep -vE '/(BarWidget|BarRpc|BarPopup|PresenceRecorder|UpdateController)\.qml$')
