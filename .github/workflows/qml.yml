name: QML offscreen contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qml:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      XDG_CACHE_HOME: /tmp/codepet-qt-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned test-only Qt runtime
        run: python3 -m pip install PySide6==6.8.3
      - name: Portable QML and lifecycle checks
        run: |
          for test in PreviewSmoke CareSmoke CareFlowSmoke FilteredDraftSmoke OverlaySmoke; do
            python3 qml/tests/run_qml.py "qml/tests/$test.qml"
          done
          python3 qml/tests/test_overlay_windows.py
          python3 qml/tests/test_quickshell_host.py
          python3 qml/tests/test_sprite_assets.py
      - name: Portable QML lint
        run: pyside6-qmllint -I qml qml/shared/*.qml qml/standalone/*.qml qml/tests/*Smoke.qml
