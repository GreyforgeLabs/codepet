name: Rust scaffold
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install fixed official Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.85.0 fmt --all --check
      - run: cargo +1.85.0 test --workspace --locked
      - run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.85.0 run --locked -p codepet -- mock-demo
