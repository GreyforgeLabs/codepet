name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install fixed official Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal --component rustfmt --component clippy
      # The Hermes stand-in in tests/clientkit needs PyYAML; the test fails without it in CI.
      - name: Install the test-only PyYAML
        run: python3 -m pip install PyYAML==6.0.2
      - run: cargo +1.86.0 fmt --all --check
      - run: cargo +1.86.0 test --workspace --locked
      - run: cargo +1.86.0 clippy --workspace --all-targets --locked -- -D warnings
      # v0.3: the retired task pipeline builds and passes behind its feature for compatibility.
      - run: cargo +1.86.0 test --workspace --locked --features codepet/legacy-tasks
      - run: cargo +1.86.0 clippy --workspace --all-targets --locked --features codepet/legacy-tasks -- -D warnings
      # The in-memory mock demo is part of the retired pipeline (spec §6.5).
      - run: cargo +1.86.0 run --locked -p codepet --features legacy-tasks -- mock-demo
      # The shipped binary's third-party notices must match the lock graph.
      - run: python3 tools/release/third_party_licenses.py --check
