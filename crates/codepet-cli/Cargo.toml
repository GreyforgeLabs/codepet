[package]
name = "codepet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
codepet-core = { path = "../codepet-core" }
codepet-protocol = { path = "../codepet-protocol" }
codepet-storage = { path = "../codepet-storage" }
serde_json = "1"

[dev-dependencies]
# The same crate with its test-support API (v0.2-shaped databases for the CLI tests).
codepet-storage = { path = "../codepet-storage", features = ["test-support"] }
tempfile = "3"

[features]
# v0.3 (spec §6.5): `providers`, `mock-demo` and the supervisor move behind this
# non-default feature in WP1. It enables the same feature in every workspace crate.
legacy-tasks = [
    "codepet-core/legacy-tasks",
    "codepet-protocol/legacy-tasks",
    "codepet-storage/legacy-tasks",
]

[lints]
workspace = true
