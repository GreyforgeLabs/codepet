[package]
name = "codepet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# No runtime dependencies. serde_json only parses the shared lifecycle vector
# fixtures in tests; it is already in the lockfile through the other crates.
[dev-dependencies]
serde_json = "1"

[features]
# v0.3 (spec §6.5): the retired task pipeline and its lifecycle paths move behind this
# non-default feature in WP1 and are deleted in v0.3.1. Declared by the WP0 skeleton.
legacy-tasks = []

[lints]
workspace = true
