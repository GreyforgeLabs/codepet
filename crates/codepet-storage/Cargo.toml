[package]
name = "codepet-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
codepet-core = { path = "../codepet-core" }
# Bundled SQLite keeps schema/transaction behavior identical across Linux distributions.
rusqlite = { version = "0.39", features = ["bundled"] }
# Safe clock_gettime(CLOCK_MONOTONIC): std exposes no cross-process monotonic value and
# unsafe code is forbidden. `fs` gives a safe open(O_NOFOLLOW | O_NONBLOCK) for the
# state-dir sidecars. `process` gives a safe prctl(PR_SET_DUMPABLE) so debug-build fault
# injection never reaches the system crash handler. Already in the lock graph through tempfile.
rustix = { version = "1.1", default-features = false, features = ["std", "time", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# Workspace crate only: recovery tests drive task.discard's real parameter validation.
codepet-protocol = { path = "../codepet-protocol" }
tempfile = "3"

[features]
# v0.3 (spec §6.5): the task pipeline, preflight tokens, review/acceptance and the care
# readiness gates move behind this non-default feature in WP1 (their tests run with it
# until v0.3.1 deletes them). `close_task_for_migration` stays outside it.
legacy-tasks = ["codepet-core/legacy-tasks", "codepet-protocol/legacy-tasks"]
# Test support for the workspace's integration tests only (`codepet_storage::testing`):
# databases shaped like an upgraded v0.2 install. Never enabled by the `codepet` binary.
test-support = []

[lints]
workspace = true
