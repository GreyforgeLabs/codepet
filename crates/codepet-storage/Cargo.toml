[package]
name = "codepet-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
codepet-core = { path = "../codepet-core" }
# Bundled SQLite keeps schema/transaction behavior identical across Linux distributions.
rusqlite = { version = "0.39", features = ["bundled"] }
# Safe clock_gettime(CLOCK_MONOTONIC): std exposes no cross-process monotonic value and
# unsafe code is forbidden. Already in the lock graph through tempfile.
rustix = { version = "1.1", default-features = false, features = ["std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# Workspace crate only: recovery tests drive task.discard's real parameter validation.
codepet-protocol = { path = "../codepet-protocol" }
tempfile = "3"

[lints]
workspace = true
